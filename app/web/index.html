<body><div class="app">
<aside class="sidebar"><div class="brand"><img src="/brand.svg" width="42" height="42" alt="汇芯无限标志" style="flex-shrink:0;border-radius:11px;margin-right:10px"><div style="flex:1;min-width:0"><div class="wordmark" style="font-size:16px;letter-spacing:-0.2px;white-space:nowrap">汇芯智能体中台</div><small style="font-size:8px;letter-spacing:1.5px;margin-top:1px">HUIXIN WORKSPACE</small></div></div>
<div class="search"><span data-icon="search"></span><input id="search" placeholder="搜索任务…" aria-label="搜索任务"><kbd>⌘ K</kbd></div>
<button class="new" id="new-task"><span data-icon="plus"></span>新建任务<span style="margin-left:auto;color:#b6b6be;font-size:10px">⌘ N</span></button>
<div class="section-label">业务空间</div><nav id="categories"></nav><div class="task-section"><div class="section-label">最近任务 <span id="recent-count" style="float:right"></span></div><div id="task-list"></div></div>
<div class="side-foot"><div class="owner"><div class="avatar">袁</div><span>袁六伟 · 台州汇芯</span></div><button class="icon" id="settings" title="工作区设置" aria-label="工作区设置"><span data-icon="settings"></span></button></div></aside>
<main class="main"><header class="topbar"><div class="breadcrumb"><span id="crumb-category">工作台</span><span class="crumbslash">/</span><b id="crumb-title">一个入口，完成业务交付</b></div><div class="top-actions"><span class="local"><i id="health-dot"></i><span id="health-label">连接本机工作区</span></span><button class="round" id="theme" title="切换明暗主题" aria-label="切换明暗主题"><span data-icon="sun"></span></button><button class="round" id="home" title="回到工作台" aria-label="回到工作台"><span data-icon="grid"></span></button></div></header>
<section class="welcome" id="welcome"><div class="eyebrow">人生无限 · 想象无界</div><h1>今天，想<span>交付</span>什么？</h1><p class="lead">把想法交给合适的智能体。<br>从需求、执行到文件交付，让每一件事都有着落。</p>
<div class="tool-strip"><span class="tool-pill"><i></i>Codex</span><span class="tool-pill"><i></i>Antigravity</span><span class="tool-pill"><i></i>WorkBuddy</span></div>
<div class="welcome-compose"><textarea id="quick-prompt" aria-label="输入任务需求" placeholder="描述你的需求（⌘ + Enter 直接发送），也可以从下方选一个模板开始…"></textarea><div class="compose-tools"><div class="compose-left"><select id="quick-category" class="provider-select" aria-label="选择业务分类"></select><select id="quick-provider" class="provider-select" aria-label="选择执行工具"></select><select id="quick-model" class="provider-select" aria-label="选择模型"></select><div id="quick-tier" class="tier-group hidden" role="group" aria-label="选择思考档位"></div></div><button class="send" id="quick-send" aria-label="直接开始任务"><span data-icon="arrow"></span></button></div></div>
<div class="templates" id="templates"></div><div class="welcome-footer">独立工作区 · 使用自己的账号 · 交付物保存在本机</div></section>
<section class="conversation hidden" id="conversation" aria-live="polite"></section>
<div class="composer-wrap hidden" id="followup"><div class="progress-capsule"><div class="progress-left"><span class="status-dot" id="capsule-dot"></span><span id="capsule-state">已完成</span></div><span id="capsule-detail"></span></div><div class="follow-compose"><textarea id="follow-prompt" aria-label="补充需求" placeholder="补充需求，或告诉智能体需要调整的地方…"></textarea><div class="compose-tools"><div class="compose-left"><span style="font-size:10px;color:#92929c" id="follow-tool"></span><span class="note">沿用当前任务</span></div><button class="send" id="follow-send" aria-label="发送后续需求"><span data-icon="arrow"></span></button></div></div><div class="hintline">本机独立执行，交付物自动归档至任务目录。<button id="stop-task" class="hidden" style="font-size:9px;color:#b4413c;text-decoration:underline">停止执行</button></div></div></main>
<aside class="right"><div class="right-title"><span id="right-heading">工作区概览</span><span data-icon="panel"></span></div><div id="right-content"></div><div class="right-bottom">汇芯智能体中台 <span id="version">0.2</span><br>为真实业务而构建。<button id="about-btn" class="link-btn" style="display:block;font-size:9px;padding-top:3px">关于与使用说明 ↗</button></div></aside>
</div>
<div class="modal-backdrop hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><form class="modal" id="task-form"><div class="modal-head"><h2 id="modal-title">新建业务任务</h2><button type="button" class="icon" id="close-modal" aria-label="关闭"><span data-icon="close"></span></button></div><label for="task-title">任务名称</label><input id="task-title" placeholder="为这次交付起一个名字" maxlength="100"><div class="form-grid"><div><label for="task-category">业务分类</label><select id="task-category"></select></div><div><label for="task-provider">执行工具</label><select id="task-provider"></select></div></div><label for="task-model">模型</label><div style="display:flex;gap:10px;align-items:center;margin-bottom:15px"><select id="task-model" style="flex:1"></select><div id="task-tier" class="tier-group hidden" role="group" aria-label="选择思考档位"></div></div><label for="task-prompt">需求与交付要求</label><textarea id="task-prompt" placeholder="说明背景、目标、已有资料和期望交付格式…" required maxlength="30000"></textarea><div class="modal-foot"><span style="font-size:10px;color:#a3a3ad">开始后会实际调用所选工具，消耗对应账号额度。</span><button type="submit" class="primary" id="create-btn">开始任务 ↗</button></div></form></div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
const TOKEN='__CSRF_TOKEN__';
const $=s=>document.querySelector(s);
const icons={search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M12 19V5m-5 5 5-5 5 5"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',settings:'<path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z"/><circle cx="12" cy="12" r="3"/>',file:'<path d="M14 3H5v18h14V8zM14 3v5h5M8 12h8M8 16h5"/>'};
function svg(name){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(icons[name]||icons.file)+'</svg>'}document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=svg(el.dataset.icon));
const categories=['内容生产','企业商单','课程交付','技能开发','经营管理','系统维护'];
const templates=[['公众号文章','从选题到结构与初稿','内容生产','请先帮我分析选题和目标读者，给出文章结构，再根据我提供的素材撰写初稿。请先询问我本次选题和已有资料。'],['企业 AI 方案','梳理需求，形成落地方案','企业商单','请帮我制作一份企业 AI 落地方案。先确认客户行业、当前流程、核心问题和验收目标，再提出可执行的方案。'],['课程与训练营','设计学习路径与课件','课程交付','请帮我设计一份课程方案，先确认学员基础、学习目标和课时，再给出课程结构与练习安排。'],['技能与工具开发','把重复工作变成流程','技能开发','我想把一个重复工作封装成工具。请先帮我确认输入、输出、现有工程和验收方法。'],['经营复盘','整理事实，明确下一步','经营管理','请帮我做一次经营复盘。先询问这次复盘的周期、目标和已有数据，不要编造任何业务数字。'],['系统维护','定位问题，验证修复','系统维护','请协助排查一个系统问题。先询问现象、出现时间、系统环境和相关日志，确认授权范围后再执行修改。']];
const statusLabels={queued:'等待提交',submitting:'正在提交',starting:'正在启动',running:'执行中',working:'执行中',completed:'已完成',failed:'执行失败',interrupted:'已停止',stopped:'已停止',needs_input:'等待处理',idle:'等待后续',waiting:'等待处理'};
let state={tasks:[],providers:{},ready:false},selected=null,category='全部',lastConversation='',first=true;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(message){$('#toast').textContent=message;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),4500)}
async function api(path,body){let res=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Huixin-Token':TOKEN},body:body?JSON.stringify(body):undefined});let data=await res.json();if(!res.ok)throw Error(data.error||'请求未完成');return data}
function timeLabel(value){let d=new Date(value);return d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}
function label(task){return statusLabels[task.state]||'等待处理'}
function renderNav(){let items=[['全部','全'],...categories.map((x,i)=>[x,['文','商','课','研','营','维'][i]])];$('#categories').innerHTML=items.map(([name,symbol])=>`<button class="category ${category===name?'active':''}" data-category="${name}"><span class="nav-symbol">${symbol}</span>${name}<span class="count">${name==='全部'?state.tasks.length:state.tasks.filter(t=>t.category===name).length||'—'}</span></button>`).join('');document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;renderNav();renderList();if(!selected)$('#crumb-category').textContent=category==='全部'?'工作台':category})}
function renderList(){let query=$('#search').value.trim().toLowerCase(),tasks=state.tasks.filter(t=>(category==='全部'||t.category===category)&&(!query||(t.title+' '+t.prompt).toLowerCase().includes(query)));$('#recent-count').textContent=tasks.length||'';$('#task-list').innerHTML=tasks.length?tasks.map(t=>`<button class="task-row ${selected===t.id?'active':''}" data-task="${t.id}"><div class="task-title">${esc(t.title)}</div><div class="task-sub"><span><i class="tiny-dot ${esc(t.state)}"></i>${label(t)}</span><span>${timeLabel(t.created_at)}</span></div></button>`).join(''):`<div class="side-empty">这里还没有任务。<br>从一次新的交付开始。</div>`;document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>selectTask(b.dataset.task))}
function providersOptions(){return Object.entries(state.providers).map(([id,p])=>`<option value="${id}">${p.name}</option>`).join('')}
const TIER_ORDER=['low','medium','high','xhigh','max','ultra'],TIER_NAMES={low:'低',medium:'中',high:'高',xhigh:'极高',max:'Max',ultra:'Ultra'};
function groupModels(pid){let p=state.providers[pid],list=p?.models||[],labels=p?.labels||{},efforts=p?.efforts||{},raw=new Map();for(let id of list){let m=id.match(/^(.*)-(low|medium|high|xhigh)$/),key=m?m[1]:id,tier=m?m[2]:'';if(!raw.has(key))raw.set(key,[]);raw.get(key).push({id,tier,rawLabel:labels[id]||id})}let groups=[];for(let [key,items] of raw){if(items.length>1){items.sort((a,b)=>TIER_ORDER.indexOf(a.tier)-TIER_ORDER.indexOf(b.tier));let cleanLabel=items[0].rawLabel.replace(/\s*\((Low|Medium|High|XHigh)\)\s*$/i,'');groups.push({base:key,label:cleanLabel,items:items.map(it=>({id:it.id,effort:'',tier:it.tier}))})}else{for(let it of items){let eff=efforts[it.id]||[];if(eff.length>1){let sorted=[...eff].sort((a,b)=>TIER_ORDER.indexOf(a)-TIER_ORDER.indexOf(b));groups.push({base:it.id,label:it.rawLabel,items:sorted.map(e=>({id:it.id,effort:e,tier:e}))})}else{groups.push({base:it.id,label:it.rawLabel,items:[{id:it.id,effort:eff[0]||'',tier:''}]})}}}}return groups}
function renderTier(pSel,mSel,tSel,preferTier=null){let groups=groupModels($(pSel).value),g=groups.find(x=>x.base===$(mSel).value),el=$(tSel);if(!g||g.items.length<=1){el.classList.add('hidden');el.innerHTML='';return}el.classList.remove('hidden');let cur=preferTier||el.querySelector('.tier-btn.active')?.dataset.tier;if(!g.items.some(x=>x.tier===cur))cur=g.items.find(x=>x.tier==='medium')?.tier||g.items.find(x=>x.tier==='high')?.tier||g.items[0].tier;el.innerHTML=g.items.map(it=>`<button type="button" class="tier-btn ${it.tier===cur?'active':''}" data-tier="${esc(it.tier)}" data-model="${esc(it.id)}" data-effort="${esc(it.effort)}">${TIER_NAMES[it.tier]||it.tier}</button>`).join('');el.querySelectorAll('.tier-btn').forEach(b=>b.onclick=()=>{el.querySelectorAll('.tier-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active')})}
function syncModels(pSel,mSel,tSel,desired=null){let groups=groupModels($(pSel).value);$(mSel).innerHTML=groups.map(g=>`<option value="${esc(g.base)}">${esc(g.label)}</option>`).join('');let preferTier=null;if(desired){let did=typeof desired==='string'?desired:desired.model,deff=typeof desired==='string'?'':(desired.effort||'');let g=groups.find(x=>x.base===did||x.items.some(i=>i.id===did));if(g){$(mSel).value=g.base;preferTier=deff||(g.items.find(i=>i.id===did)?.tier||null)}}$(mSel).onchange=()=>renderTier(pSel,mSel,tSel);renderTier(pSel,mSel,tSel,preferTier)}
function selectedChoice(mSel,tSel){let btn=$(tSel).querySelector('.tier-btn.active');return btn?{model:btn.dataset.model,effort:btn.dataset.effort||''}:{model:$(mSel).value,effort:''}}
function openNew(template=null,prompt=''){if(!state.ready){toast(state.error||'本机执行引擎正在初始化，请稍后再试');return}$('#task-title').value=template?.[0]||'';$('#task-category').value=template?.[2]||(category==='全部'?'内容生产':category);$('#task-prompt').value=prompt||template?.[3]||'';$('#task-provider').value=$('#quick-provider').value;syncModels('#task-provider','#task-model','#task-tier',selectedChoice('#quick-model','#quick-tier'));$('#modal').classList.remove('hidden');setTimeout(()=>$('#task-title').focus(),30)}
function closeModal(){$('#modal').classList.add('hidden')}
function copyCode(btn){let pre=btn.nextElementSibling;navigator.clipboard?.writeText(pre.textContent).then(()=>{btn.textContent='已复制';setTimeout(()=>btn.textContent='复制',1400)})}
function formatMessage(text){let blocks=[];let out=esc(text).replace(/```[^\n]*\n([\s\S]*?)```/g,(_,c)=>{let i=blocks.length;blocks.push(`<div class="code-wrap"><button type="button" class="copy-btn" onclick="copyCode(this)">复制</button><pre>${c}</pre></div>`);return `\x00B${i}\x00`});out=out.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/^###? (.+)$/gm,'<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');out=out.replace(/((?:^\|.+\|$\n?)+)/gm,m=>{let rows=m.trim().split('\n').filter(r=>!/^\|[\s:-]+\|$/.test(r.replace(/[^|\s:-]/g,'')));if(!rows.length)return m;return '<table>'+rows.map((r,idx)=>'<tr>'+r.slice(1,-1).split('|').map(c=>idx===0?`<th>${c.trim()}</th>`:`<td>${c.trim()}</td>`).join('')+'</tr>').join('')+'</table>'});out=out.replace(/((?:^[-*] .+$\n?)+)/gm,m=>'<ul>'+m.trim().split('\n').map(l=>`<li>${l.slice(2)}</li>`).join('')+'</ul>');out=out.replace(/((?:^\d+\. .+$\n?)+)/gm,m=>'<ol>'+m.trim().split('\n').map(l=>`<li>${l.replace(/^\d+\. /,'')}</li>`).join('')+'</ol>');return out.replace(/\x00B(\d+)\x00/g,(_,i)=>blocks[+i])}
function renderConversation(task){let messages=task.messages?.length?task.messages:[{role:'user',text:task.prompt}],fingerprint=JSON.stringify([task.id,messages,task.state,task.permission,task.error]);if(fingerprint===lastConversation)return;lastConversation=fingerprint;let el=$('#conversation'),nearEnd=el.scrollHeight-el.scrollTop-el.clientHeight<120;el.innerHTML=messages.map((m,index)=>`<article class="message ${m.role==='user'?'user':'assistant'}"><div class="message-label"><strong>${m.role==='user'?'你':esc(state.providers[task.provider]?.name||'智能体')}</strong><span>· ${m.role==='user'?'任务需求':'执行回复'}</span></div><div class="body">${formatMessage(m.role==='user'&&index===0?task.prompt:m.text)}</div></article>`).join('');if(['queued','submitting','starting','running','working'].includes(task.state))el.innerHTML+=`<div class="processing"><span class="spinner"></span>${label(task)}，正在同步真实任务状态…</div>`;if(task.permission){let pm=task.permission;el.innerHTML+=`<div class="notice perm"><b>需要你审批：${esc(pm.title)}</b>${pm.detail?`<pre class="perm-detail">${esc(pm.detail)}</pre>`:''}<div class="perm-actions">${pm.options.map(o=>`<button class="action-chip${/reject|deny/i.test(o.kind+o.id)?' danger':''}" data-opt="${esc(o.id)}">${esc(o.name)}</button>`).join('')}<button class="action-chip danger" data-opt="">取消本次操作</button></div><small>智能体会暂停等待，30 分钟未处理将自动取消。</small></div>`}if(task.error)el.innerHTML+=`<div class="error-text">${esc(task.error)}</div>`;el.innerHTML+=`<div class="task-meta-line ${task.state==='failed'?'error':''}"><span class="status">${label(task)}</span><span>·</span><span>${esc(state.providers[task.provider]?.name)} / ${esc(task.model)}</span><span>·</span><span>${timeLabel(task.updated_at)} 更新</span></div>`;el.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answerPermission(task.id,b.dataset.opt||null,b));if(nearEnd||task.permission)el.scrollTop=el.scrollHeight}
async function taskAction(id,action,btn){if(action==='archive'&&!btn.dataset.confirm){btn.dataset.confirm='1';btn.textContent='确认删除？';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.confirm;btn.textContent='删除任务'}},3000);return}try{if(action==='open-folder'){await api('/api/tasks/'+id+'/open-folder',{});return toast('已在 Finder 中打开交付目录')}if(action==='refresh'){const fresh=await api('/api/tasks/'+id+'/refresh',{});state.tasks=state.tasks.map(t=>t.id===id?fresh:t);render();return toast('状态已同步')}if(action==='retry'){const nt=await api('/api/tasks/'+id+'/retry',{});state.tasks.unshift(nt);selectTask(nt.id);return toast('已重新发起任务')}if(action==='archive'){await api('/api/tasks/'+id+'/archive',{});state.tasks=state.tasks.filter(t=>t.id!==id);selected=null;localStorage.removeItem('huixin-selected');render();return toast('任务已清理')}}catch(e){toast(e.message)}}
async function syncProviders(btn){btn.disabled=true;let orig=btn.textContent;btn.textContent='正在探测本机模型…';try{let res=await api('/api/providers/sync',{});state.providers=res.providers;syncModels('#quick-provider','#quick-model','#quick-tier');syncModels('#task-provider','#task-model','#task-tier');renderRight(state.tasks.find(t=>t.id===selected));let total=Object.values(state.providers).reduce((s,p)=>s+(p.models?.length||0),0);toast('模型已同步，当前共接入 '+total+' 个模型。')}catch(e){toast(e.message)}finally{btn.disabled=false;btn.textContent=orig}}
function renderRight(task){$('#right-heading').textContent=task?'本次交付':'工作区概览';if(!task){let total=Object.values(state.providers).reduce((s,p)=>s+(p.models?.length||0),0);$('#right-content').innerHTML=`<h3>你的执行团队</h3><p>三个入口共接入 ${total} 个可用模型。</p>${Object.entries(state.providers).map(([id,p],i)=>`<div class="provider-row"><div class="provider-monogram">${p.name[0]||'?'}</div><div><div class="pn">${esc(p.name)}</div><small>已接入 ${(p.models||[]).length} 个模型</small></div><span class="check">✓</span></div>`).join('')}<div class="provider-row grokr"><div class="provider-monogram">G</div><div><div class="pn">Grok Bot</div><small>等待可用的接入方式</small></div><span style="margin-left:auto;font-size:9px;color:#999">未接入</span></div><div class="info-section"><div class="section-caption">工作方式</div><div class="info-card"><b>把每次执行，留成一次交付。</b><p>任务、对话和生成文件归在一起。<br>业务分开管理，进度随时可查。</p><div class="info-foot"><span>本机独立运行</span><span>中文优先</span></div></div><div style="display:flex;gap:14px;align-items:center"><button class="link-btn" onclick="syncProviders(this)">同步本机模型 ↻</button></div></div>`;return}let actual=task.artifacts.filter(a=>a.name!=='需求.md');$('#right-content').innerHTML=`<h3>${esc(task.title)}</h3><p>${esc(task.category)} · ${timeLabel(task.created_at)} 创建</p><div class="action-bar"><button class="action-chip" onclick="taskAction('${task.id}','open-folder',this)">Finder 打开</button><button class="action-chip" onclick="taskAction('${task.id}','refresh',this)">刷新</button><button class="action-chip" onclick="taskAction('${task.id}','retry',this)">重新发起</button><button class="action-chip danger" onclick="taskAction('${task.id}','archive',this)">删除任务</button></div><div class="info-section"><div class="section-caption">任务信息</div><div class="detail-row"><span>执行工具</span><span>${esc(state.providers[task.provider]?.name)}</span></div><div class="detail-row"><span>模型</span><span>${esc(task.model)}${task.effort?' · '+(TIER_NAMES[task.effort]||task.effort):''}</span></div><div class="detail-row"><span>当前状态</span><span>${label(task)}</span></div></div><div class="info-section"><div class="section-caption">交付文件 <span style="float:right">${actual.length}</span></div>${actual.length?actual.map(a=>`<a class="file" target="_blank" rel="noopener" href="/files/${task.id}/${a.name.split('/').map(encodeURIComponent).join('/')}">${svg('file')}<span title="${esc(a.name)}">${esc(a.name.split('/').pop())}</span><small>${a.size<1024?a.size+' B':Math.ceil(a.size/1024)+' KB'}</small></a>`).join(''):'<div class="empty-files">暂未生成交付文件。<br>产物会在这里自动出现。</div>'}<a class="link-btn" style="display:block;text-decoration:none" target="_blank" rel="noopener" href="/files/${task.id}/%E9%9C%80%E6%B1%82.md">查看原始需求 ↗</a></div><div class="info-section"><div class="info-card"><b>验收后，再对外交付。</b><p>智能体完成回复后，请核对文件内容、事实和格式。发布仍需明确授权。</p></div></div>`}
function selectTask(id){selected=id;lastConversation='';render();localStorage.setItem('huixin-selected',id);load()}
function render(){renderNav();renderList();let task=state.tasks.find(t=>t.id===selected);$('#welcome').classList.toggle('hidden',!!task);$('#conversation').classList.toggle('hidden',!task);$('#followup').classList.toggle('hidden',!task);if(task){$('#crumb-category').textContent=task.category;$('#crumb-title').textContent=task.title;renderConversation(task);$('#capsule-state').textContent=label(task);$('#capsule-detail').textContent=task.permission?'等待你审批':task.state==='completed'?'任务回复已完成':['queued','submitting','starting','running','working'].includes(task.state)?'本机引擎执行中':label(task);$('#capsule-dot').style.background=task.state==='failed'?'var(--red)':task.state==='completed'?'var(--green)':'#c99a4b';$('#follow-tool').textContent=(state.providers[task.provider]?.name||'')+' · '+task.model;let running=['queued','submitting','starting','running','working','needs_input'].includes(task.state);$('#follow-send').disabled=running;$('#stop-task').classList.toggle('hidden',!running)}else{$('#crumb-category').textContent=category==='全部'?'工作台':category;$('#crumb-title').textContent='一个入口，完成业务交付'}renderRight(task);$('#health-label').textContent=state.ready?'本机独立引擎':state.error?'引擎异常':'引擎初始化中';$('#health-dot').style.background=state.ready?'var(--green)':'#c99a4b';if(state.version)$('#version').textContent=state.version}
async function load(){try{state=await api('/api/state');if(first){let catOpts=categories.map(c=>`<option>${c}</option>`).join('');$('#quick-category').innerHTML=catOpts;$('#task-category').innerHTML=catOpts;$('#quick-provider').innerHTML=providersOptions();$('#task-provider').innerHTML=providersOptions();syncModels('#quick-provider','#quick-model','#quick-tier');syncModels('#task-provider','#task-model','#task-tier');selected=localStorage.getItem('huixin-selected');first=false}if(selected&&state.tasks.some(t=>t.id===selected)){try{const fresh=await api('/api/tasks/'+selected);state.tasks=state.tasks.map(t=>t.id===selected?fresh:t)}catch(e){}}else if(selected){selected=null;localStorage.removeItem('huixin-selected')}render()}catch(e){$('#health-label').textContent='连接中断';$('#health-dot').style.background='var(--red)'}}
async function stopCurrentTask(){if(!selected)return;try{const fresh=await api('/api/tasks/'+selected+'/stop',{});state.tasks=state.tasks.map(t=>t.id===fresh.id?fresh:t);render();toast('已停止执行')}catch(e){toast(e.message)}}
async function answerPermission(id,opt,btn){document.querySelectorAll('[data-opt]').forEach(b=>b.disabled=true);try{const fresh=await api('/api/tasks/'+id+'/permission',{option:opt});state.tasks=state.tasks.map(t=>t.id===id?fresh:t);render();toast(opt?'已提交审批结果':'已取消该操作')}catch(e){toast(e.message);document.querySelectorAll('[data-opt]').forEach(b=>b.disabled=false)}}
async function quickSend(){let p=$('#quick-prompt').value.trim();if(!p)return toast('先描述一下这次想完成的事情。');if(!state.ready)return toast(state.error||'本机执行引擎正在初始化，请稍后再试');let btn=$('#quick-send');btn.disabled=true;try{let ch=selectedChoice('#quick-model','#quick-tier');let task=await api('/api/tasks',{title:p.split('\n')[0].slice(0,36),category:$('#quick-category').value,provider:$('#quick-provider').value,model:ch.model,effort:ch.effort,prompt:p});$('#quick-prompt').value='';state.tasks.unshift(task);selectTask(task.id);toast('任务已提交，将由所选工具实际执行。')}catch(e){toast(e.message)}finally{btn.disabled=false}}
$('#templates').innerHTML=templates.map((t,i)=>`<button class="template" data-template="${i}"><span class="template-arrow">↗</span><span class="template-name">${t[0]}</span><small>${t[1]}</small></button>`).join('');document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>openNew(templates[+b.dataset.template]));
$('#new-task').onclick=()=>openNew();$('#quick-send').onclick=quickSend;$('#close-modal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};$('#quick-provider').onchange=()=>syncModels('#quick-provider','#quick-model','#quick-tier');$('#task-provider').onchange=()=>syncModels('#task-provider','#task-model','#task-tier');$('#search').oninput=renderList;
$('#quick-prompt').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();quickSend()}});
$('#follow-prompt').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();$('#follow-send').click()}});
$('#task-form').onsubmit=async e=>{e.preventDefault();let btn=$('#create-btn');btn.disabled=true;btn.textContent='正在提交…';try{let ch=selectedChoice('#task-model','#task-tier');let task=await api('/api/tasks',{title:$('#task-title').value,category:$('#task-category').value,provider:$('#task-provider').value,model:ch.model,effort:ch.effort,prompt:$('#task-prompt').value});closeModal();$('#quick-prompt').value='';state.tasks.unshift(task);selectTask(task.id);toast('任务已提交，将由所选工具实际执行。')}catch(e){toast(e.message)}finally{btn.disabled=false;btn.textContent='开始任务 ↗'}};
$('#follow-send').onclick=async()=>{let text=$('#follow-prompt').value.trim();if(!text)return;let btn=$('#follow-send');btn.disabled=true;try{await api('/api/tasks/'+selected+'/message',{message:text});$('#follow-prompt').value='';toast('后续需求已发送。');await load()}catch(e){toast(e.message)}finally{btn.disabled=false}};
$('#home').onclick=()=>{selected=null;localStorage.removeItem('huixin-selected');render()};$('#stop-task').onclick=stopCurrentTask;$('#theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('huixin-dark',document.body.classList.contains('dark')?'1':'0')};if(localStorage.getItem('huixin-dark')==='1')document.body.classList.add('dark');
$('#settings').onclick=()=>toast('数据目录：'+(state.workspace||'正在连接')+'。模型配置可编辑 ~/.local/share/huixin-agent-hub/providers.json。');$('#about-btn').onclick=()=>toast('∞ 人生无限、无限游戏，AI 带来无限想象。汇芯智能体中台 '+(state.version||'0.5.0')+' · 本机业务工作台。');
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('#search').focus()}if((e.metaKey||e.ctrlKey)&&e.key==='n'){e.preventDefault();openNew()}if(e.key==='Escape')closeModal()});
load();setInterval(load,3500);
</script></body></html>
